name: ai-check
on:
  push:
    branches: [ci-preview]
    paths-ignore: ['shots/**']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: |
          pip install pillow
          for u in https://thispersondoesnotexist.com/ https://upload.wikimedia.org/wikipedia/commons/a/a0/Pierre-Person.jpg https://assets.codepen.io/9177687/female-4572747_640.jpg; do
            curl -fsSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36" -o raw.bin "$u" || continue
            python -c "from PIL import Image; im=Image.open('raw.bin').convert('RGB'); print(im.size); im.save('face.jpg', quality=92)" && echo "using $u" && break
          done
          ls -la face.jpg
      - run: python ci/ai_check.py
        continue-on-error: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f shots && git commit -qm "ai-check shots" && git push -q origin HEAD:ci-preview
