name: ai-check
on:
  push:
    branches: [ci-preview]
    paths-ignore: ['shots/**']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: curl -fsSL -A "Mozilla/5.0" -o face.jpg https://thispersondoesnotexist.com/ && file face.jpg
      - run: python ci/ai_check.py
        continue-on-error: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f shots && git commit -qm "ai-check shots" && git push -q origin HEAD:ci-preview
